# WhatsApp n'a AUCUNE API publique pour savoir si un numero est banni.
# Mets ici l'URL de TON service qui renvoie du JSON :
#   {"status": "active" | "banned" | "unknown"}
# Appel : GET API_URL?number=+509XXXXXXXX
API_URL = ""

G = "\033[92m"
DG = "\033[32m"
R = "\033[91m"
Y = "\033[93m"
W = "\033[97m"
X = "\033[0m"
CHARS = "ã‚¢ã‚¤ã‚¦ã‚¨ã‚ªã‚«ã‚­ã‚¯ã‚±ã‚³ã‚µã‚·ã‚¹ã‚»ã‚½0123456789ABCDEFÎžÎ”Î˜"
CREDIT = "powered by ð—ð—ð—ð“ðšµðð“Î”ð‚ðˆðš¯ð ð€ððš¯ðð˜ðŒðš¯ð”ð’ DEV"


def clear():
    os.system("cls" if os.name == "nt" else "clear")


def matrix_rain(duration=4.0):
    cols, rows = shutil.get_terminal_size((80, 24))
    drops = [random.randint(-rows, 0) for _ in range(cols)]
    end = time.time() + duration
    sys.stdout.write("\033[?25l")
    try:
        while time.time() < end:
            buf = []
            for i in range(cols):
                y = drops[i]
                if 0 <= y < rows:
                    buf.append(f"\033[{y + 1};{i + 1}H{W}{random.choice(CHARS)}")
                if 0 <= y - 1 < rows:
                    buf.append(f"\033[{y};{i + 1}H{G}{random.choice(CHARS)}")
                if 0 <= y - 6 < rows:
                    buf.append(f"\033[{y - 5};{i + 1}H{DG}{random.choice(CHARS)}")
                if 0 <= y - 12 < rows:
                    buf.append(f"\033[{y - 11};{i + 1}H ")
                drops[i] += 1
                if drops[i] - 12 > rows and random.random() > 0.9:
                    drops[i] = random.randint(-10, 0)
            sys.stdout.write("".join(buf) + X)
            sys.stdout.flush()
            time.sleep(0.05)
    finally:
        sys.stdout.write("\033[?25h" + X)
        clear()


def banner():
    print(G + r"""
 __        ___   ____    ____    _    _   _
 \ \      / / | / ___|  | __ )  / \  | \ | |
  \ \ /\ / /| || |      |  _ \ / _ \ |  \| |
   \ V  V / | || |___   | |_) / ___ \| |\  |
    \_/\_/  |_| \____|  |____/_/   \_\_| \_|
        WHATSAPP  BAN  CHECKER
""" + X)
    print(DG + "  " + CREDIT + X + "\n")


def normalize(n):
    n = re.sub(r"[\s\-()]", "", n)
    return n if re.fullmatch(r"\+?\d{8,15}", n) else None


def check(number):
    if not API_URL:
        return "config", "Aucun service configure. Renseigne API_URL dans le script."
    url = API_URL + ("&" if "?" in API_URL else "?") + "number=" + urllib.parse.quote(number)
    try:
        with urllib.request.urlopen(url, timeout=15) as r:
            return json.load(r).get("status", "unknown"), None
    except Exception as e:
        return "error", str(e)


def main():
    matrix_rain()
    banner()
    while True:
        try:
            raw = input(G + "[?] Numero (+indicatif...) ou 'q' pour quitter > " + X).strip()
        except (EOFError, KeyboardInterrupt):
            break
        if raw.lower() in ("q", "quit", "exit"):
            break
        n = normalize(raw)
        if not n:
            print(Y + "[!] Numero invalide.\n" + X)
            continue
        print(G + "[*] Analyse de " + n + " ..." + X)
        status, err = check(n)
        if status == "banned":
            print(R + f"[x] {n} : BANNI\n" + X)
        elif status == "active":
            print(G + f"[+] {n} : ACTIF\n" + X)
        elif status == "unknown":
            print(Y + f"[?] {n} : INCONNU\n" + X)
        else:
            print(Y + f"[!] {err}\n" + X)
    print(DG + "\n" + CREDIT + X)


if __name__ == "__main__":
    main()
